services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  model-init:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/ollama"]
    command: ["pull", "${OLLAMA_MODEL:-qwen2.5-coder:3b}"]
    depends_on:
      ollama:
        condition: service_healthy

  app:
    build: .
    ports:
      - "127.0.0.1:8502:8502"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:3b}
      CUSTOMER_DATABASE: /app/data/text_sql_demo.duckdb
      SYNTHETIC_DEMO: "1"
    volumes:
      - demo_data:/app/data
    command:
      - /bin/sh
      - -c
      - >-
        python -m customer_segmentation_assistant.text_sql_demo
        --database "$$CUSTOMER_DATABASE" &&
        exec streamlit run streamlit_app.py --server.address=0.0.0.0
        --server.port=8502 --server.headless=true
    depends_on:
      model-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8502/_stcore/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
    restart: unless-stopped

volumes:
  ollama_models:
  demo_data:
