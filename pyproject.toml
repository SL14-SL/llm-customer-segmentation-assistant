[project]
name = "customer-segmentation-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Steffen Lau", email = "steffen.datascience@gmail.com" }
]
requires-python = ">=3.12.9"
dependencies = [
    "duckdb>=2.0.0",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "sqlglot>=30.24.0",
    "streamlit>=1.66.1",
]

[project.scripts]
customer-segmentation-assistant = "customer_segmentation_assistant:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
