name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12.9"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Lint
        run: >
          uv run --no-sync ruff check
          src tests scripts
          streamlit_app.py streamlit_agent_demo.py

      - name: Run all tests
        run: uv run --no-sync pytest -q

  container:
    name: Container smoke test (${{ matrix.demo }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - demo: text-to-sql
            port: 8502
          - demo: comparison
            port: 8503

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build application
        run: docker build -t customer-analytics-demo .

      - name: Start Text-to-SQL demo without model inference
        if: matrix.demo == 'text-to-sql'
        run: |
          docker run -d --name app-demo \
            -p 127.0.0.1:8502:8502 \
            -e CUSTOMER_DATABASE=/app/data/text_sql_demo.duckdb \
            -e SYNTHETIC_DEMO=1 \
            customer-analytics-demo sh -c \
            'python -m customer_segmentation_assistant.demo.text_to_sql &&
             exec streamlit run streamlit_app.py
             --server.address=0.0.0.0
             --server.port=8502
             --server.headless=true'

      - name: Start comparison demo without model inference
        if: matrix.demo == 'comparison'
        run: |
          docker run -d --name app-demo \
            -p 127.0.0.1:8503:8503 \
            customer-analytics-demo \
            streamlit run streamlit_agent_demo.py \
            --server.address=0.0.0.0 \
            --server.port=8503 \
            --server.headless=true

      - name: Wait for application health
        env:
          APP_PORT: ${{ matrix.port }}
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent \
              "http://localhost:${APP_PORT}/_stcore/health"; then
              echo "Application is healthy."
              exit 0
            fi

            sleep 2
          done

          docker logs app-demo
          exit 1

      - name: Verify Text-to-SQL demo data
        if: matrix.demo == 'text-to-sql'
        run: >-
          docker exec app-demo python -c
          "from customer_segmentation_assistant.storage.database import query_dataframe;
          assert query_dataframe('SELECT COUNT(*) FROM customers').iloc[0, 0] == 300"

      - name: Verify comparison tools and computed report
        if: matrix.demo == 'comparison'
        run: |
          docker exec -i app-demo python - <<'PY'
          from pathlib import Path

          from customer_segmentation_assistant.comparison.agent import (
              run_comparison,
          )
          from customer_segmentation_assistant.demo.comparison import (
              create_demo_database,
          )

          database = Path("/app/data/agent_demo.duckdb")
          create_demo_database(database)

          def deterministic_planner(context):
              remaining = context["remaining_contracts"]

              if remaining:
                  return {
                      "kind": "tool_call",
                      "contract": remaining[0],
                  }

              return {"kind": "finish"}

          result = run_comparison(
              contracts=("Month-to-month", "One year"),
              minimum_churn_probability=0.7,
              database=database,
              max_tool_calls=4,
              planner=deterministic_planner,
          )

          assert result["tool_calls"] == 2

          observations = {
              item["result"]["contract"]: item["result"]
              for item in result["observations"]
          }

          assert observations["Month-to-month"]["customer_count"] == 2
          assert observations["One year"]["customer_count"] == 1

          assert "Month-to-month" in result["answer"]
          assert "One year" in result["answer"]

          print("Comparison tools and computed report verified.")
          PY

      - name: Container logs
        if: always()
        run: docker logs app-demo || true

      - name: Remove container
        if: always()
        run: docker rm -f app-demo || true